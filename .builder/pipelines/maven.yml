name: Java CI with Maven

on: [push, manual]
push:
  branches: [main]

checkout: true

jobs:
  build:
    image: maven:3.9-eclipse-temurin-17
    cache:
      key: m2-config-json-schema
      paths: [.m2/repository]
    steps:
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Pdefault --no-transfer-progress -Dmaven.repo.local=.m2/repository
      - name: Validate generated JSON schema sample
        run: |
          # The maven:3.9-eclipse-temurin-17 image (Debian) has no Python/pip, so `pip` was `command
          # not found` (exit 127). Install pip, then check-jsonschema (PEP 668 needs the override).
          apt-get update -qq && apt-get install -y -qq python3-pip
          pip install --quiet --break-system-packages check-jsonschema
          check-jsonschema --check-metaschema spring-boot-json-schema-sample/application.yaml
