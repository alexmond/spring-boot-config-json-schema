name: Java CI with Maven

# One long-lived branch per maintained Spring Boot line (main = latest line, plus a
# <major>.<minor> maintenance branch each), so CI runs on all of them, not just main.
on:
  push:
    branches: [ main, "[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # Compatibility matrix: the Java 17 baseline plus the later LTS releases this Spring Boot
    # line supports. Bytecode always targets the baseline. Reporting steps run once, on the
    # baseline JDK, so results are not uploaded once per JDK.
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    permissions:
      contents: write        # for the dependency-graph snapshot submission
      checks: write          # for the unit-test-result check run
      pull-requests: write   # to comment test results on PRs

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Pdefault --no-transfer-progress

      # The generic sample test compares the schema it generates with the copies tracked in
      # docs/modules/ROOT/attachments. Every JDK of the matrix must reproduce them byte for
      # byte. On a failure, keep what this JDK generated so the difference can be inspected.
      - name: Upload generated schema
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-schema-jdk-${{ matrix.java }}
          path: spring-boot-json-schema-generic-sample/target/generated-schema/
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() && matrix.java == '17' }}
        with:
          files: |
            **/surefire-reports/TEST-*.xml

      # Upload only when CODECOV_TOKEN is set; without it the step is skipped so CI stays
      # green (tokenless upload is not allowed on this org).
      - name: Add coverage to PR
        if: ${{ env.CODECOV_TOKEN != '' && matrix.java == '17' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/spring-boot-config-json-schema-starter/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' && matrix.java == '17' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          report-type: test_results
          files: |
            **/surefire-reports/TEST-*.xml

      - name: Report tests + coverage to UniTrack
        if: ${{ always() && matrix.java == '17' }}
        uses: alexmond/unitrack/action@v0
        with:
          url: ${{ vars.UNITRACK_URL }}
          token: ${{ secrets.UNITRACK_TOKEN }}
          junit: '**/surefire-reports/TEST-*.xml'
          jacoco: '**/jacoco.xml'
          soft-fail: "true"
          split-by-module: "true"

      # Best-effort supply-chain snapshot; needs the repo's Dependency graph feature. Never
      # fail CI on it, and only submit for pushes (a PR from a fork has no write token).
      - name: Submit Dependency Snapshot
        if: ${{ github.event_name == 'push' && matrix.java == '17' }}
        continue-on-error: true
        uses: advanced-security/maven-dependency-submission-action@v6


      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install check-jsonschema
        run: pipx install check-jsonschema
      - name: Validate files
        run: |
          check-jsonschema --check-metaschema spring-boot-json-schema-sample/application.yaml
